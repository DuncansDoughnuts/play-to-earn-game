name: Package Production Branch

on:
  push:
    branches: [production/hardening-2026-09-01]
    paths:
      - '.github/workflows/package-for-download.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create source archive
        shell: bash
        run: zip -qr "$RUNNER_TEMP/play-to-earn-game-production.zip" . -x '.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: play-to-earn-game-production
          path: ${{ runner.temp }}/play-to-earn-game-production.zip
          if-no-files-found: error
          retention-days: 1
