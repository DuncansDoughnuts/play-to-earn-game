name: Production Upgrade Verification

on:
  push:
    branches: [production/hardening-2026-09-01]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_VERSION: '0.1.0'
      NEXT_PUBLIC_ACTIVE_CHAIN: 'mumbai'
      NEXT_PUBLIC_CHARACTER_EDITION_ADDRESS: '0x16A131b7e5a62E8fe83f0993aAF2ECCaBF519382'
      NEXT_PUBLIC_MINING_CONTRACT_ADDRESS: '0x5231B9a9E55739641a63989faec3db4d8F56fBBb'
      NEXT_PUBLIC_GOLD_GEMS_ADDRESS: '0x18B18e5D2375c592997e1eaFf6C77A6bd24F5c44'
      NEXT_PUBLIC_PICKAXE_EDITION_ADDRESS: '0x9d33597aD43bE6295Fe7626baDBF72B862F71bB2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Resolve supported application toolchain
        working-directory: application
        run: |
          npm pkg set 'scripts.lint=eslint . --ext .js,.jsx,.ts,.tsx'
          npm install --save-exact --package-lock-only next@15.5.24 eslint-config-next@15.5.24
          npm install --save-dev --save-exact --package-lock-only eslint@8.57.1
      - name: Install application deterministically
        working-directory: application
        run: npm ci --no-audit --no-fund
      - name: Lint application
        working-directory: application
        run: npm run lint
      - name: Type check application
        working-directory: application
        run: npx tsc --noEmit
      - name: Build application
        working-directory: application
        run: npm run build

      - name: Pin contract tooling and lock dependencies
        working-directory: contracts
        run: |
          npm pkg set 'scripts.build=npx --yes thirdweb@5.121.1 build'
          npm pkg set 'scripts.deploy=npx --yes thirdweb@5.121.1 deploy'
          npm pkg set 'scripts.publish=npx --yes thirdweb@5.121.1 publish'
          npm pkg delete scripts.release
          npm install --package-lock-only --ignore-scripts
      - name: Install contracts deterministically
        working-directory: contracts
        run: npm ci --no-audit --no-fund
      - name: Compile contracts
        working-directory: contracts
        run: npm run compile

      - name: Persist verified manifests
        shell: bash
        run: |
          if git diff --quiet -- application/package.json application/package-lock.json contracts/package.json contracts/package-lock.json; then
            echo 'Dependency manifests already match the verified production state.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add application/package.json application/package-lock.json contracts/package.json contracts/package-lock.json
          git commit -m 'prod: pin supported application and contract toolchains'
          git push origin HEAD:production/hardening-2026-09-01
