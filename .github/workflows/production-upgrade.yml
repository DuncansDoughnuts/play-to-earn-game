name: Production Upgrade Verification

on:
  push:
    branches: [production/hardening-2026-09-01]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: application
    env:
      NEXT_PUBLIC_APP_VERSION: 0.1.0
      NEXT_PUBLIC_ACTIVE_CHAIN: mumbai
      NEXT_PUBLIC_CHARACTER_EDITION_ADDRESS: 0x16A131b7e5a62E8fe83f0993aAF2ECCaBF519382
      NEXT_PUBLIC_MINING_CONTRACT_ADDRESS: 0x5231B9a9E55739641a63989faec3db4d8F56fBBb
      NEXT_PUBLIC_GOLD_GEMS_ADDRESS: 0x18B18e5D2375c592997e1eaFf6C77A6bd24F5c44
      NEXT_PUBLIC_PICKAXE_EDITION_ADDRESS: 0x9d33597aD43bE6295Fe7626baDBF72B862F71bB2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - name: Resolve supported Next.js and lock dependencies
        run: npm install --save-exact --package-lock-only next@15.5.24 eslint-config-next@15.5.24
      - name: Deterministic install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Upload application manifests
        uses: actions/upload-artifact@v7
        with:
          name: application-production-manifests
          path: |
            application/package.json
            application/package-lock.json
          retention-days: 2

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Deterministic install
        run: npm ci --no-audit --no-fund
      - name: Compile contracts
        run: npm run compile
      - name: Upload contract manifest
        uses: actions/upload-artifact@v7
        with:
          name: contract-production-manifest
          path: contracts/package-lock.json
          retention-days: 2
